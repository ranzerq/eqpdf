<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaperPad</title>
<style>
:root{--bg:#e6e8ee;--panel:#fff;--ink:#1b1f27;--mut:#6b7280;--line:#d9dce3;--key:#eef0f4;--acc:#3b6df0;--op:#dfe6fb;color-scheme:light}
[data-theme=dark]{--bg:#14171d;--panel:#1d212a;--ink:#e8eaef;--mut:#98a0b0;--line:#313744;--key:#2a2f3b;--acc:#6b93ff;--op:#34405f;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100dvh}
#tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.tbg{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}.tbg:last-child{border:0}
.b{background:var(--key);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}.b:hover{filter:brightness(.96)}.b.on{background:var(--acc);color:#fff;border-color:var(--acc)}.b.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#mid{flex:1;display:flex;min-height:0}
#side{width:92px;flex:none;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:12px}
.sg{display:flex;flex-direction:column;gap:5px}.sh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:center}
.sb{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11px;line-height:1.15}.sb .ic{font-size:17px}
.pillv{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}.pillv button{border:0;background:var(--key);padding:8px 2px;cursor:pointer;font-size:12px}.pillv button.on{background:var(--acc);color:#fff}
.row2{display:flex;gap:4px}.row2 .b{flex:1;padding:6px 0;text-align:center}
#widths{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.wb{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--key);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.wb.on{background:var(--acc);border-color:var(--acc)}.wb i{display:block;border-radius:50%;background:var(--ink)}.wb.on i{background:#fff}
#sws{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;justify-items:center}.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 2px var(--acc)}
#pages{flex:1;min-width:0;overflow:auto;padding:14px 8px 80px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.page{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3);flex:none}.page canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#pages[data-tool=pen] .ov,#pages[data-tool=hl] .ov,#pages[data-tool=eraser] .ov{touch-action:none;cursor:crosshair}#pages[data-tool=text] .ov{cursor:text;touch-action:pan-x pan-y pinch-zoom}#pages[data-tool=move] .ov{cursor:move;touch-action:pan-x pan-y pinch-zoom}
.caret{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#welcome{margin:auto;text-align:center;max-width:520px;padding:30px;background:var(--panel);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.2)}#welcome h1{margin:0 0 6px}#welcome .b{margin:4px;padding:10px 16px;font-size:15px}
#dock{background:var(--panel);border-top:1px solid var(--line);padding:6px 8px;z-index:5}#dock[hidden]{display:none}
.dk{display:grid;grid-template-columns:repeat(60,1fr);gap:4px;max-width:760px;margin:0 auto}
.k{position:relative;height:40px;border:0;border-radius:8px;background:var(--key);font:600 17px/1 system-ui,sans-serif;cursor:pointer;padding:0;overflow:hidden}.k:active{filter:brightness(.9)}.k.o{background:var(--op)}.k.v{font:400 20px/1 'Cambria Math','STIX Two Math','STIXGeneral','Times New Roman',serif}.k.g{background:#2f9e5b;color:#fff;font:700 14px system-ui}.k svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.k small{display:none}
#svhost{position:fixed;inset:0;pointer-events:none;z-index:20}#tmenu{position:fixed;z-index:21;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.3)}#tmenu[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}#toast.on{opacity:.95}
#banner{display:flex;gap:8px;align-items:center;justify-content:center;background:#fff7d6;color:#333;border-bottom:1px solid #e8d98a;padding:6px}#banner[hidden]{display:none}
#kb{position:fixed;left:-100px;top:0;width:10px;height:10px;opacity:0}
.hint{color:var(--mut);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:10px}.modal[hidden]{display:none}
.box{background:var(--panel);border-radius:14px;width:min(860px,96vw);height:min(86vh,720px);display:flex;flex-direction:column;padding:14px;gap:8px}#kdbody{overflow:auto;flex:1;min-height:0}
.kg h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ki{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.ki .nm{flex:1;font-weight:600;line-height:1.15}.ki .gl{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--key);font:400 19px 'Cambria Math','STIX Two Math','STIXGeneral',serif}.ki .gl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chip{min-width:70px;background:var(--key);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;font:600 14px ui-monospace,monospace}.chip.cap{background:var(--acc);color:#fff}.xk{padding:3px 8px}
details.more{margin-top:10px}details.more summary{cursor:pointer;font-weight:600;padding:6px 0}
@media(max-width:760px){.b{padding:7px 9px}#tb{gap:4px}#side{width:68px}.sb{font-size:10px}}
</style></head><body>
<div id="app">
<div id="banner" hidden><span id="bantxt"></span><button class="b pri" id="banok">Restore</button><button class="b" id="bannope">Dismiss</button></div>
<div id="tb">
 <div class="tbg"><button class="b" id="bopen">📄 Open PDF</button><button class="b" id="bnew" title="A blank scratch page (plain, lined or graph) when you have no PDF, e.g. for sketches or rough working">＋ New paper</button><button class="b" id="badd" title="Add a blank page after this one">＋ Page</button><button class="b pri" id="bexp">⬇ Export PDF</button></div>
 <div class="tbg"><button class="b" id="zout">−</button><span id="zlab" style="min-width:42px;text-align:center">100%</span><button class="b" id="zin">+</button><button class="b" id="zfit" title="Fit width">⤢</button></div>
 <div class="tbg"><button class="b" id="pprev">‹</button><span id="plab" style="min-width:48px;text-align:center">–</span><button class="b" id="pnext">›</button></div>
 <div class="tbg"><button class="b" id="bundo" title="Undo">↶</button><button class="b" id="bredo" title="Redo">↷</button></div>
 <div class="tbg"><button class="b" id="bdark" title="Dark mode">☾</button><button class="b" id="bkeys">⌨ Keys</button></div>
</div>
<div id="mid">
<div id="pages" data-tool="text"></div>
<aside id="side">
 <div class="sg"><div class="sh">Tools</div><div id="tools" class="sg"><button class="b sb on" data-tool="text" title="Write text and equations"><span class="ic">✎</span>Write</button><button class="b sb" data-tool="pen" title="Pen"><span class="ic">🖊</span>Pen</button><button class="b sb" data-tool="hl" title="Highlighter"><span class="ic">▮</span>Highlight</button><button class="b sb" data-tool="eraser" title="Eraser"><span class="ic">⌫</span>Eraser</button><button class="b sb" data-tool="move" title="Move boxes"><span class="ic">✥</span>Move</button></div></div>
 <div class="sg"><div class="sh">Typing</div><div class="pillv" id="modep" title="Switch between normal text and equations"><button data-m="text" class="on">Text</button><button data-m="eq">Equation</button></div><div class="row2"><button class="b" id="fsm" title="Smaller text">A−</button><button class="b" id="fsp" title="Larger text">A+</button></div></div>
 <div class="sg"><div class="sh">Stroke</div><div id="widths"></div><button class="b sb" id="bsmooth" title="Smooth the curve after you lift the pen"><span class="ic">〰</span>Smooth</button></div>
 <div class="sg"><div class="sh">Colour</div><div id="sws"></div></div>
 <div class="sg"><button class="b sb" id="bins" title="Insert any symbol"><span class="ic">⌕</span>Insert</button><button class="b sb" id="bdock" title="Equation keypad"><span class="ic">⌨</span>Keypad</button></div>
</aside>
</div>
<div id="dock" hidden><div class="dk" id="dk"></div></div>
</div>
<div id="svhost"></div><div id="tmenu" hidden></div><div id="toast"></div>

<script>
/* ===== shared equation engine (built from equation-pad.html) ===== */
const FF="'Cambria Math','STIX Two Math','STIXGeneral','Times New Roman',Times,serif",SZ=44;
const $=s=>document.querySelector(s),cv=document.createElement('canvas').getContext('2d');
const f=v=>+v.toFixed(2),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let root=[],cur={arr:root,i:0},EXPORT=false;
const tw=(t,s,it)=>{cv.font=`${it?'italic ':''}${s}px ${FF}`;return cv.measureText(t).width};
function mk(t,slots){const n={t,slots};slots.forEach(s=>s.owner=n);return n}
const setPar=a=>a.forEach(n=>n.par=a);
function ins(n){delSel();cur.arr.splice(cur.i,0,n);n.par=cur.arr;cur.i++}
const PRM={')':'(',']':'[','}':'{'},LT={'(':'\\left(','[':'\\left[','{':'\\left\\{'},RT={')':'\\right)',']':'\\right]','}':'\\right\\}'};
function match(arr){const st={'(':[],'[':[],'{':[]},p={};arr.forEach((n,i)=>{if(n.t!=='c')return;const v=n.v;if(v==='('||v==='['||v==='{')st[v].push(i);else if((v===')'||v===']'||v==='}')&&st[PRM[v]].length){const j=st[PRM[v]].pop();p[i]=j;p[j]=i}});return p}
/* ---------- editing ---------- */
const last=a=>a[a.length-1];
let anc=null,hist=[{d:'[]',c:{p:[],i:0}}],hi=0;
function chain(arr,i){const c=[{arr,i,l:0}];while(arr&&arr.owner){const o=arr.owner;arr=o.par;if(!arr)break;c.push({arr,i:arr.indexOf(o),l:1})}return c}
function selRange(){if(!anc)return null;const ca=chain(anc.arr,anc.i),cb=chain(cur.arr,cur.i);
 for(const ea of ca){const eb=cb.find(e=>e.arr===ea.arr);if(eb){const a=Math.min(ea.i,eb.i),b=Math.max(ea.i+ea.l,eb.i+eb.l);return a===b?null:{arr:ea.arr,a,b}}}return null}
function delSel(){const r=selRange();anc=null;if(!r)return false;r.arr.splice(r.a,r.b-r.a);cur={arr:r.arr,i:r.a};return true}
function takeSel(){const r=selRange();if(!r)return null;anc=null;return{arr:r.arr,j:r.a,items:r.arr.splice(r.a,r.b-r.a)}}
const ser=a=>a.map(n=>n.slots?{t:n.t,s:n.slots.map(ser),o:n.op,l:n.l}:{t:'c',v:n.v,l:n.l,up:n.up});
function des(j){const a=[];j.forEach(n=>{const x=n.s?mk(n.t,n.s.map(des)):{t:'c',v:n.v,l:n.l,up:n.up};if(n.s&&n.o){x.op=n.o;x.l=n.l}x.par=a;a.push(x)});return a}
function cpath(){const p=[];let a=cur.arr;while(a.owner){const o=a.owner;p.unshift([o.par.indexOf(o),o.slots.indexOf(a)]);a=o.par}return{p,i:cur.i}}
function restore(h){root=des(JSON.parse(h.d));anc=null;try{let a=root;h.c.p.forEach(([i,k])=>{a=a[i].slots[k]});cur={arr:a,i:Math.min(h.c.i,a.length)}}catch(e){cur={arr:root,i:root.length}}}
function snap(){const d=JSON.stringify(ser(root));if(d!==hist[hi].d){hist.length=hi+1;hist.push({d,c:cpath()});hi++;if(hist.length>300){hist.shift();hi--}}else hist[hi].c=cpath()}
function undo(){snap();if(hi>0){hi--;restore(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi])}}
function fn_(v,l){ins({t:'c',v,l});ins({t:'c',v:'(',l:'('});ins({t:'c',v:')',l:')'});cur.i--}
function left(){const{arr,i}=cur;if(i>0){const p=arr[i-1];if(p.slots){const s=last(p.slots);cur={arr:s,i:s.length}}else cur.i--}else if(arr.owner){const o=arr.owner,k=o.slots.indexOf(arr);if(k>0){const s=o.slots[k-1];cur={arr:s,i:s.length}}else cur={arr:o.par,i:o.par.indexOf(o)}}}
function right(){const{arr,i}=cur;if(i<arr.length){const nx=arr[i];if(nx.slots)cur={arr:nx.slots[0],i:0};else cur.i++}else if(arr.owner){const o=arr.owner,k=o.slots.indexOf(arr);if(k<o.slots.length-1)cur={arr:o.slots[k+1],i:0};else cur={arr:o.par,i:o.par.indexOf(o)+1}}}
function vert(d){let a=cur.arr,i=cur.i;while(a.owner){const o=a.owner;if(o.t==='f'||o.t==='m'||(o.t==='b'&&o.slots.length>1)){const k=o.slots.indexOf(a),t=o.t==='f'?(d<0?0:1):o.t==='m'?(d<0?1:2):(d<0?1:0);if(k!==t&&!(o.t==='m'&&k===0)){const s=o.slots[t];cur={arr:s,i:Math.min(i,s.length)};return}}i=o.par.indexOf(o);a=o.par}}
function bs(){if(delSel())return;const{arr,i}=cur;if(i>0){const p=arr[i-1];if(p.slots){if(p.slots.every(s=>!s.length)){arr.splice(i-1,1);cur.i--}else left()}else{arr.splice(i-1,1);cur.i--}}
 else if(arr.owner){const o=arr.owner;if(o.slots.every(s=>!s.length)){const pa=o.par,j=pa.indexOf(o);pa.splice(j,1);cur={arr:pa,i:j}}else left()}}
const isNum=n=>n.t==='c'&&/^[0-9.]$/.test(n.v);
function grab(arr,i){let j=i,par=false;while(j>0&&(arr[j-1].t==='s'||arr[j-1].t==='u'))j--;
 if(j>0){const c=arr[j-1];if(isNum(c)){while(j>0&&isNum(arr[j-1]))j--}
 else if(c.v===')'){let d=0,k=j-1;for(;k>=0;k--){if(arr[k].v===')')d++;else if(arr[k].v==='('){d--;if(!d)break}}if(k>=0){j=k;par=true}else j--}
 else if(c.t!=='c'||/[A-Za-z\u0370-\u03ff∞]/.test(c.v))j--}
 return[j,par]}
function frac(){const T=takeSel();let arr,j,par=false,num;if(T){arr=T.arr;j=T.j;num=T.items}else{arr=cur.arr;const i=cur.i;[j,par]=grab(arr,i);num=arr.splice(j,i-j)}
 if(par&&num.length>1&&num[0].v==='('&&last(num).v===')'&&match(num)[0]===num.length-1)num=num.slice(1,-1);
 const fr=mk('f',[num,[]]);setPar(num);arr.splice(j,0,fr);fr.par=arr;cur={arr:fr.slots[num.length?1:0],i:0}}
function root_(nth){const T=takeSel();if(T){const r=mk('r',nth?[[],T.items]:[T.items]);setPar(T.items);T.arr.splice(T.j,0,r);r.par=T.arr;cur=nth?{arr:r.slots[0],i:0}:{arr:T.arr,i:T.j+1};return}const r=mk('r',nth?[[],[]]:[[]]);ins(r);cur={arr:r.slots[0],i:0}}
function script(k){const n=mk(k,[[]]);ins(n);cur={arr:n.slots[0],i:0}}
/* ---------- LaTeX ---------- */
function tex(arr){let o='';const pr=match(arr);
 arr.forEach((n,i)=>{const p=arr[i-1];
  if(n.t==='c'){if(pr[i]!=null&&LT[n.v])o+=LT[n.v];else if(pr[i]!=null&&RT[n.v])o+=RT[n.v];else o+=n.l+(n.l[0]==='\\'?' ':'')}
  else if(n.t==='f')o+=`\\frac{${tex(n.slots[0])}}{${tex(n.slots[1])}}`;
  else if(n.t==='m')o+=tex(n.slots[0])+'\\frac{'+tex(n.slots[1])+'}{'+tex(n.slots[2])+'}';
  else if(n.t==='b')o+=n.l+'_{'+tex(n.slots[0])+'}'+(n.slots[1]?'^{'+tex(n.slots[1])+'}':'')+' ';
  else if(n.t==='r')o+=n.slots.length>1?`\\sqrt[${tex(n.slots[0])}]{${tex(n.slots[1])}}`:`\\sqrt{${tex(n.slots[0])}}`;
  else{const c=n.t==='s'?'^':'_';if(!p||p.t===n.t)o+='{}';o+=`${c}{${tex(n.slots[0])}}`}});
 return o}
/* ---------- layout ---------- */
const MI=c=>/[a-z]/.test(c)?(c==='h'?'ℎ':String.fromCodePoint(0x1D44E+c.charCodeAt(0)-97)):/[A-Z]/.test(c)?String.fromCodePoint(0x1D434+c.charCodeAt(0)-65):(c>='α'&&c<='ω')?String.fromCodePoint(0x1D6FC+c.charCodeAt(0)-0x3B1):c;
function cbox(n,s){const one=n.v.length===1,it=!n.up&&one&&/[A-Za-z\u03b1-\u03c9]/.test(n.v),fn=n.v.length>1,big=one&&'∫∬∭∮'.includes(n.v),bin=one&&'+−×÷±∓'.includes(n.v),rel=one&&'=≤≥≠<>≈≡∼∝≪≫∈∉⊂⊆⊃⊇'.includes(n.v);
 const m=bin?.2*s:rel?.28*s:n.up?.14*s:0,rm=n.v===','?.18*s:fn?.08*s:n.up?0:m,gs=big?1.4*s:s,dy=big?.14*s:0,txt=it?MI(n.v):n.v;
 return{ic:it?.1*s:0,w:tw(txt,gs,false)+m+rm,a:big?1.0*s:.72*s,d:big?.42*s:.22*s,draw:(x,y)=>`<text x="${f(x+m)}" y="${f(y+dy)}" font-size="${f(gs)}">${esc(txt)}</text>`}}
function pbox(side,a,d,s,k='('){a+=.06*s;d+=.06*s;const w=.34*s,sw=f(.055*s);
 return{w,a,d,draw:(x,y)=>{const t=y-a,b=y+d,m=(t+b)/2,q=.11*s,X=u=>x+(side?.34*s-u*s:u*s);let p;
  if(k==='(')p=`M${f(X(.26))} ${f(t)}C${f(X(-.02))} ${f(y-a*.4)} ${f(X(-.02))} ${f(y+d*.4)} ${f(X(.26))} ${f(b)}`;
  else if(k==='[')p=`M${f(X(.26))} ${f(t)}H${f(X(.08))}V${f(b)}H${f(X(.26))}`;
  else p=`M${f(X(.3))} ${f(t)}C${f(X(.17))} ${f(t)} ${f(X(.2))} ${f(t+q)} ${f(X(.2))} ${f(t+2*q)}V${f(m-q)}C${f(X(.2))} ${f(m-.5*q)} ${f(X(.12))} ${f(m)} ${f(X(.03))} ${f(m)}C${f(X(.12))} ${f(m)} ${f(X(.2))} ${f(m+.5*q)} ${f(X(.2))} ${f(m+q)}V${f(b-2*q)}C${f(X(.2))} ${f(b-q)} ${f(X(.17))} ${f(b)} ${f(X(.3))} ${f(b)}`;
  return`<path d="${p}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`}}}
function mbox(n,s){const W=row(n.slots[0],s),F=fbox({slots:[n.slots[1],n.slots[2]]},s),g=.08*s;return{w:W.w+g+F.w,a:Math.max(W.a,F.a),d:Math.max(W.d,F.d),draw:(x,y)=>W.draw(x,y)+F.draw(x+W.w+g,y)}}

/* ---- pen widths + smoothing after release (keeps corners, light touch for handwriting) ---- */
function smoothStroke(p){const n=p.length/2;if(n<5)return p;let P=[];for(let i=0;i<n;i++)P.push([p[2*i],p[2*i+1]]);const cr=new Array(n).fill(false);
 for(let i=2;i<n-2;i++){const a=[P[i][0]-P[i-2][0],P[i][1]-P[i-2][1]],b=[P[i+2][0]-P[i][0],P[i+2][1]-P[i][1]],la=Math.hypot(a[0],a[1]),lb=Math.hypot(b[0],b[1]);if(la<1.2||lb<1.2)continue;if((a[0]*b[0]+a[1]*b[1])/(la*lb)<.25)cr[i]=true}
 for(let pass=0;pass<2;pass++){const Q=P;P=Q.map((pt,i)=>(i===0||i===n-1||cr[i]||cr[i-1]||cr[i+1])?pt:[(Q[i-1][0]+2*Q[i][0]+Q[i+1][0])/4,(Q[i-1][1]+2*Q[i][1]+Q[i+1][1])/4])}
 const o=[];P.forEach(q=>o.push(+q[0].toFixed(2),+q[1].toFixed(2)));return o}
const PW=[.8,1.4,2.2,3.2,4.6,6.5],HW=[8,14,22,32,44,60];
function renderWidths(){const L=U.tool==='hl'?HW:PW,cur_=U.tool==='hl'?U.hlw:U.pen,w=$('#widths');w.innerHTML='';L.forEach(v=>{const b=document.createElement('button');b.className='wb'+(Math.abs(v-cur_)<.01?' on':'');b.title=v+' pt';const d=document.createElement('i');d.style.width=d.style.height=clamp(v*(U.tool==='hl'?.35:2.2)+2,3,22)+'px';b.appendChild(d);b.onclick=()=>{if(U.tool==='hl')U.hlw=v;else U.pen=v;savePrefs();renderWidths()};w.appendChild(b)});$('#bsmooth').classList.toggle('on',U.smooth)}
const widthStep=d=>{const L=U.tool==='hl'?HW:PW,c=U.tool==='hl'?U.hlw:U.pen;let i=L.findIndex(v=>Math.abs(v-c)<.01);if(i<0)i=2;i=clamp(i+d,0,L.length-1);if(U.tool==='hl')U.hlw=L[i];else U.pen=L[i];savePrefs();renderWidths()};
const toggleSmooth=()=>{U.smooth=!U.smooth;savePrefs();renderWidths();toast('Pen smoothing '+(U.smooth?'on':'off'))};
$('#bsmooth').onclick=toggleSmooth;
const nextColor=()=>{const i=SW.indexOf(U.color);const c=SW[(i+1)%SW.length];document.querySelectorAll('.sw')[SW.indexOf(c)].click()};
/* ---- dark mode ---- */
function setDark(on){document.documentElement.dataset.theme=on?'dark':'light';$('#bdark').textContent=on?'☀':'☾';try{localStorage.setItem('pp-theme',on?'dark':'light')}catch(e){}}

(()=>{let t=null;try{t=localStorage.getItem('pp-theme')}catch(e){}setDark(t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches)})();
/* ---- solve panel sits well above the equation ---- */
function placeChip(el){const pg=U.page,b=U.box;if(!pg||!b||!U.atom||!b._L)return;const L=b._L,p=L.pos[b.s.indexOf(U.atom)];if(!p)return;const ln=L.lines[p.l],r=pg.svg.getBoundingClientRect(),k=r.width/pg.w,h=el.offsetHeight||48,w=el.offsetWidth||360;
 const aw=U.atom.row?U.atom.row.w:0,cx=r.left+(b.x+p.x+aw)*k;let y=r.top+(b.y+ln.y-ln.a)*k-h-38;if(y<8)y=r.top+(b.y+ln.y+ln.d)*k+34;
 el.style.left=clamp(cx-w*.35,8,innerWidth-w-8)+'px';el.style.top=clamp(y,8,innerHeight-h-8)+'px';el.style.right='auto';el.style.bottom='auto'}

 else{GROUPS.forEach(([t,ids])=>{const ok=ids.filter(i=>byId[i]);if(!ok.length)return;const g=document.createElement('div');g.className='kg';g.innerHTML='<h4>'+esc(t)+'</h4>';const gr=document.createElement('div');gr.className='kgrid';
   ok.forEach(id=>{const a=byId[id],r=document.createElement('div');r.className='ki';r.innerHTML=`<span class="gl">${a.html||esc(a.label)}</span><span class="nm">${esc(NM[id]||'')}</span>`;const b=document.createElement('button');b.className='chip'+(capE===id?' cap':'');b.textContent=capE===id?'press a key…':(B[id]||'—').replace('Arrow','');b.onclick=()=>{capE=capE===id?null:id;buildKeys()};const x=document.createElement('button');x.className='b xk';x.textContent='✕';x.onclick=()=>{B[id]='';saveBK();buildKeys()};r.append(b,x);gr.appendChild(r)});g.appendChild(gr);c.appendChild(g)})}}
